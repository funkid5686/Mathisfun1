<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathisFun</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            background: linear-gradient(135deg, #6c2cff, #00c6ff);
        }

        h1 {
            margin: 0;
            font-size: 48px;
        }

        header p {
            font-size: 20px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .game {
            background: #1c2130;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .game-icon {
            height: 150px;
            display: grid;
            place-items: center;
            overflow: hidden;
            border-radius: 10px;
            background: #10131a;
        }

        .game-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .game h2 {
            margin: 15px 0;
        }

        .play {
            display: inline-block;
            background: #00c6ff;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        .play:hover {
            background: #008dcc;
        }

        footer {
            padding: 25px;
            color: #888;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 MathisFun</h1>
        <p>Choose a game and have fun!</p>
    </header>

    <main class="games">

        <div class="game">
            <div class="game-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/2048_logo.svg" alt="2048 game logo">
            </div>
            <h2>2048</h2>
            <a class="play" href="2048/index.html">PLAY</a>
        </div>

        <div class="game">
            <div class="game-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/93/Angry_Birds_logo.svg" alt="Angry Birds game logo">
            </div>
            <h2>Angry Birds</h2>
            <a class="play" href="angry-birds/index.html">PLAY</a>
        </div>

        <div class="game">
            <div class="game-icon">
                <img src="https://www.google.com/s2/favicons?domain=crazygames.com&sz=256" alt="Awesome Tanks game artwork">
            </div>
            <h2>Awesome Tanks</h2>
            <a class="play" href="awesome-tanks/index.html">PLAY</a>
        </div>

        <div class="game">
            <div class="game-icon">
                <img src="https://www.google.com/s2/favicons?domain=madalingames.com&sz=256" alt="Madalin Stunt Cars 2 game artwork">
            </div>
            <h2>Madalin Stunt Cars 2</h2>
            <a class="play" href="madalin-stunt-cars-2/index.html">PLAY</a>
        </div>

    </main>

    <footer>
        © 2026 MathisFun
    </footer>

</body>
</html>
